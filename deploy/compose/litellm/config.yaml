# Example LiteLLM aliases. Pull matching Ollama tags before use.
# Prefer alias names in clients so you can rewire backends later.

model_list:
  - model_name: alfred-coder
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      extra_body:
        options:
          num_ctx: 32768
    model_info:
      supports_function_calling: true
      max_input_tokens: 32768

  - model_name: alfred-reasoner
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      extra_body:
        options:
          num_ctx: 32768
    model_info:
      supports_function_calling: true
      max_input_tokens: 32768

  # Optional FIM / autocomplete — pull a small *base* coder tag if you use Twinny-style FIM.
  # - model_name: alfred-fim
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:1.5b-base
  #     api_base: http://ollama:11434
  #     timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
