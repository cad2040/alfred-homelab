# Example LiteLLM aliases + teaching callbacks (Bronze + skill inject + persona).
# Pull matching Ollama tags before use. Prefer aliases in clients.

model_list:
  - model_name: alfred-coder
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      extra_body:
        options:
          num_ctx: 32768
    model_info:
      supports_function_calling: true
      max_input_tokens: 32768

  - model_name: alfred-reasoner
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      extra_body:
        options:
          num_ctx: 32768
    model_info:
      supports_function_calling: true
      max_input_tokens: 32768

  # Optional FIM — pull qwen2.5-coder:1.5b-base (or set ALFRED_FIM_TAG) for Bronze summaries.
  # - model_name: alfred-fim
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:1.5b-base
  #     api_base: http://ollama:11434
  #     timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 300
  callbacks:
    - alfred_routing_skills.proxy_handler_instance
    - alfred_middleware_bronze.proxy_handler_instance
    - custom_prompt.prompt_management

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
