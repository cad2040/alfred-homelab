# Alfred deploy template — Ollama + LiteLLM with sanitized twins.
# GPU (default):
#   ../../scripts/bootstrap.sh
# CPU-only:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Clients: http://127.0.0.1:4000/v1  Authorization: Bearer $LITELLM_MASTER_KEY

services:
  ollama:
    image: ollama/ollama:latest
    container_name: alfred-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [alfred_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:v1.81.0-stable
    container_name: alfred-litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      PYTHONPATH: /app/config
      OLLAMA_HOST: http://ollama:11434
      ALFRED_SKILLS_ROOT: /app/skills
      ALFRED_DOMAINS_YAML: /app/config/domains.yaml
      ALFRED_BRONZE_BUDGETS: /app/config/bronze_budgets.yaml
      ALFRED_LITELLM_CONFIG: /app/config/config.yaml
      ALFRED_WEBSEARCH: "0"
      ALFRED_SKILL_JUDGE: "0"
      ALFRED_CODER_TAG: ${ALFRED_CODER_TAG:-qwen2.5-coder:7b-instruct}
      ALFRED_REASONER_TAG: ${ALFRED_REASONER_TAG:-qwen2.5:7b-instruct}
      ALFRED_PLANNER_TAG: ${ALFRED_PLANNER_TAG:-qwen2.5:7b-instruct}
      ALFRED_FIM_TAG: ${ALFRED_FIM_TAG:-qwen2.5-coder:1.5b-base}
      # Persona off unless set:
      ALFRED_PERSONA: ${ALFRED_PERSONA:-}
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
      - ./litellm/bronze_budgets.yaml:/app/config/bronze_budgets.yaml:ro
      - ../../routing/domains.yaml:/app/config/domains.yaml:ro
      - ../../middleware/alfred_routing_callback.py:/app/config/alfred_routing_callback.py:ro
      - ../../middleware/alfred_middleware.py:/app/config/alfred_middleware.py:ro
      - ../../middleware/custom_prompt.py:/app/config/custom_prompt.py:ro
      - ../../skills:/app/skills:ro
    command: ["--config", "/app/config/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on: [ollama]
    networks: [alfred_net]

networks:
  alfred_net:
    name: alfred_net

volumes:
  ollama_data:
