# Example Alfred-like stack — Ollama + LiteLLM with teaching callbacks.
# Not a full private estate. Adapt volumes, models, and keys.
#
# GPU (default):
#   cp .env.example .env && docker compose up -d
# CPU-only:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
#
# Clients: http://127.0.0.1:4000/v1  Authorization: Bearer $LITELLM_MASTER_KEY

services:
  ollama:
    image: ollama/ollama:latest
    container_name: alfred-ollama-example
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [alfred_example]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:v1.81.0-stable
    container_name: alfred-litellm-example
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      PYTHONPATH: /app/config
      OLLAMA_HOST: http://ollama:11434
      ALFRED_SKILLS_ROOT: /app/skills
      ALFRED_DOMAINS_YAML: /app/config/domains.yaml
      ALFRED_BRONZE_BUDGETS: /app/config/bronze_budgets.yaml
      ALFRED_LITELLM_CONFIG: /app/config/config.yaml
      # Optional: disable persona with ALFRED_PERSONA: ""
      # Optional Bronze→Chroma ingest (capture only; no prune):
      # CHROMA_URL: http://chroma:8000/api/v2/tenants/default_tenant/databases/default_database
    volumes:
      - ./litellm:/app/config:ro
      - ../../reference/litellm/alfred_middleware_bronze.py:/app/config/alfred_middleware_bronze.py:ro
      - ../../reference/litellm/alfred_routing_skills.py:/app/config/alfred_routing_skills.py:ro
      - ../../reference/litellm/custom_prompt.py:/app/config/custom_prompt.py:ro
      - ../../skills:/app/skills:ro
    command: ["--config", "/app/config/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on: [ollama]
    networks: [alfred_example]

networks:
  alfred_example:
    name: alfred_example

volumes:
  ollama_data:
